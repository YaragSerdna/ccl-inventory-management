<main class="login-page">
    <section class="login-card">
        <div class="brand-icon" aria-hidden="true">
            <span>CI</span>
        </div>

        <p class="eyebrow">GESTIÓN EMPRESARIAL</p>
        <h1>Control de inventario</h1>
        <p class="subtitle">Ingresa tus credenciales para administrar los productos y movimientos.</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-field">
                <label for="username">Usuario</label>
                <input id="username" type="text" formControlName="username" autocomplete="username"
                    placeholder="Ingresa tu usuario"
                    [class.invalid]="loginForm.controls.username.touched && loginForm.controls.username.invalid" />

                <small class="field-error"
                    *ngIf="loginForm.controls.username.touched && loginForm.controls.username.hasError('required')">
                    El usuario es obligatorio.
                </small>
            </div>

            <div class="form-field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password" autocomplete="current-password"
                    placeholder="Ingresa tu contraseña"
                    [class.invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid" />

                <small class="field-error" *ngIf="loginForm.controls.password.touched &&
            loginForm.controls.password.hasError('required')">
                    La contraseña es obligatoria.
                </small>
            </div>

            <div class="error-banner" *ngIf="errorMessage" role="alert">
                {{ errorMessage }}
            </div>

            <button type="submit" class="login-button" [disabled]="loading">
                {{ loading ? 'Validando credenciales...' : 'Iniciar sesión' }}
            </button>
        </form>

        <p class="security-note">
            Acceso protegido mediante autenticación segura.
        </p>
    </section>

    <footer class="page-footer">
        CCL Inventory · Sistema de gestión de inventario
    </footer>
</main>
